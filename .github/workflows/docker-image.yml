name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image-suffix: ""
            image-name: toolbox
          - dockerfile: Dockerfile.azure
            image-suffix: "-azure"
            image-name: toolbox-azure
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Extract Alpine version
      id: alpine-version
      run: |
        VERSION=$(grep '^FROM alpine' ${{ matrix.dockerfile }} | cut -d':' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_GHCR }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_DOCKERHUB }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY_GHCR }}/${{ github.repository }}${{ matrix.image-suffix }}
          ${{ env.REGISTRY_DOCKERHUB }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=alpine${{ steps.alpine-version.outputs.version }}
        labels: |
          org.opencontainers.image.title=${{ matrix.image-name }}
          org.opencontainers.image.description=Alpine-based ${{ matrix.image-name }}${{ contains(matrix.image-name, '-azure') && ' with Azure CLI' || '' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: mode=max
        sbom: true

    - name: Build image for PR scanning
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        load: true
        tags: ${{ matrix.image-name }}:scan
        cache-from: type=gha

    - name: Set Trivy image ref
      id: scan-ref
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "ref=${{ matrix.image-name }}:scan" >> $GITHUB_OUTPUT
        else
          echo "ref=${{ env.REGISTRY_GHCR }}/${{ github.repository }}${{ matrix.image-suffix }}:latest" >> $GITHUB_OUTPUT
        fi

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ steps.scan-ref.outputs.ref }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
        category: ${{ matrix.image-name }}
